spring:
  datasource:
    url: jdbc:h2:mem:tpair1;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: PUBLIC
        globally_quoted_identifiers: false
  sql:
    init:
      mode: never
