/**
 * Bonus Exercice 5 : JAAS Configuration
 * Définit les LoginModules pour l'authentification
 */

/**
 * Domain 1: DbLoginModule pour authentification username/password
 */
DbAuthenticationDomain {
    fr.uit.univparis8.tpair.tpair1.security.jaas.DbLoginModule required
        debug=true;
};

/**
 * Domain 2: TokenLoginModule pour validation de tokens
 */
TokenAuthenticationDomain {
    fr.uit.univparis8.tpair.tpair1.security.jaas.TokenLoginModule required
        debug=true;
};
